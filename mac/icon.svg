<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The Mac app icon: the Bolt Z on Voltage blue, in the macOS shape (an 824 px rounded square with
       a margin and a soft shadow). `./make-icon.sh` turns this into AppIcon.png. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C72FF"/>
      <stop offset="1" stop-color="#2447E8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="101.500" y="101.500" width="821" height="821" rx="183.500" fill="none" stroke="url(#sheen)" stroke-width="3"/>
  <g transform="translate(512 512) scale(2.05) translate(-128 -128)">
    <path fill="#FFFFFF" d="M46.66 42 L55.89 26 L220.89 26 L136.6 172 L209.34 214 L200.11 230 L35.11 230 L119.4 84 Z"/>
  </g>
</svg>
